
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Atención Pandero</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #172b4d;
        }

        .contenedor {
            max-width: 650px;
            margin: 35px auto;
            padding: 28px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 22px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #073b7a;
        }

        .descripcion {
            color: #52647a;
            line-height: 1.6;
        }

        #estado {
            margin: 24px 0;
            padding: 14px;
            border-radius: 8px;
            background: #edf4ff;
            color: #073b7a;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .botones {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            padding: 13px 22px;
            border: 0;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #iniciar {
            background: #087443;
        }

        #finalizar {
            background: #c62828;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #descargas {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #dbe2ea;
        }

        #descargas a {
            display: block;
            margin: 12px 0;
            color: #0759a5;
        }
    </style>
</head>
<body>
    <main class="contenedor">
        <h1>Simulador de Atención Pandero</h1>

        <p class="descripcion">
            Inicia una llamada de práctica y conversa por voz con un cliente simulado.
        </p>

        <div id="estado" role="status" aria-live="polite">
            Estado: Cargando simulador...
        </div>

        <div class="botones">
            <button id="iniciar" type="button">
                Iniciar llamada
            </button>

            <button id="finalizar" type="button" disabled>
                Finalizar llamada
            </button>
        </div>

        <section id="descargas" hidden>
            <h2>Descargas de la llamada</h2>
            <a id="descargarAudio" href="#" download="llamada-pandero.webm" style="display:none">
                Descargar audio de la llamada
            </a>
            <a id="descargarTexto" href="#" download="transcripcion-pandero.txt" style="display:none">
                Descargar transcripción
            </a>
        </section>
    </main>

    <script src="/frontend/main.js" defer></script>
</body>
</html>
