name: Validate simulator
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile main.py pandero_knowledge.py
      - name: Test scenario guide and rubric
        run: python -m unittest discover -s tests -v
