name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Sync application to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing GitHub Actions secret: HF_TOKEN"
            exit 1
          fi
          if [ -z "$HF_SPACE_REPO" ]; then
            echo "Missing GitHub Actions secret: HF_SPACE_REPO (format: username/space-name)"
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id=os.environ["HF_SPACE_REPO"],
              repo_type="space",
              folder_path=".",
              ignore_patterns=[
                  ".git/**",
                  ".github/**",
                  ".venv/**",
                  "**/__pycache__/**",
                  "tests/**",
                  ".env",
                  ".env.*",
              ],
              commit_message="Deploy from GitHub Actions",
          )
          print("Hugging Face Space updated successfully.")
          PY
